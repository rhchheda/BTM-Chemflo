<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="BTM CHEMFLO - Professional Presentation">
  <meta name="theme-color" content="#FF9500">

  <title>BTM CHEMFLO - Presentation</title>

  <!-- ═══════════════════════════════════════════════════════════════ -->
  <!-- SHARED STYLES (Both presentations use) -->
  <!-- ═══════════════════════════════════════════════════════════════ -->

  <link rel="stylesheet" href="shared-styles.css">

  <!-- OPTIONAL: Presentation-specific CSS -->
  <!-- <link rel="stylesheet" href="dealer-theme.css">  for dealer -->
  <!-- <link rel="stylesheet" href="investor-theme.css"> for investor -->

  <style>
    /* Additional inline styles can go here */
  </style>
</head>
<body>

  <!-- ═══════════════════════════════════════════════════════════════ -->
  <!-- PASSWORD SPLASH SCREEN (Shared component) -->
  <!-- ═══════════════════════════════════════════════════════════════ -->

  <div id="password-splash" class="show">
    <div class="password-splash-content">
      <h1>BTM CHEMFLO</h1>
      <p>Enter password to access presentation</p>

      <form id="auth-form">
        <input
          type="password"
          id="password-input"
          placeholder="Password"
          autocomplete="off"
          required
        />
        <button type="submit" id="auth-submit-btn">Access Presentation</button>
      </form>

      <p style="margin-top: var(--spacing-lg); font-size: var(--font-size-sm); color: var(--color-gray-dark);">
        Password required for access
      </p>
    </div>
  </div>

  <!-- ═══════════════════════════════════════════════════════════════ -->
  <!-- MAIN PRESENTATION CONTAINER -->
  <!-- ═══════════════════════════════════════════════════════════════ -->

  <div id="presentation">
    <!-- Header/Navbar -->
    <header id="presentation-header" style="
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: var(--spacing-lg);
      background: var(--color-primary-white);
      border-bottom: 1px solid var(--color-gray-border);
      position: sticky;
      top: 0;
      z-index: 100;
    ">
      <div>
        <h1 style="
          font-size: var(--font-size-xl);
          color: var(--color-primary-orange);
          margin: 0;
        ">BTM CHEMFLO</h1>
        <p style="
          font-size: var(--font-size-sm);
          color: var(--color-gray-dark);
          margin: var(--spacing-sm) 0 0 0;
        ">Professional Presentation</p>
      </div>

      <div style="display: flex; gap: var(--spacing-md);">
        <button id="exit-btn" onclick="exitPresentation()" style="
          padding: var(--spacing-md) var(--spacing-lg);
          background: transparent;
          border: 2px solid var(--color-gray-border);
          border-radius: var(--radius-md);
          cursor: pointer;
          font-size: var(--font-size-base);
          transition: all var(--transition-fast);
        " onmouseover="this.style.borderColor='var(--color-primary-orange)'" onmouseout="this.style.borderColor='var(--color-gray-border)'">
          Exit
        </button>
      </div>
    </header>

    <!-- Main Content Area -->
    <main id="presentation-content" style="
      max-width: 1400px;
      margin: 0 auto;
      padding: var(--spacing-2xl);
    ">
      <!-- Content sections will be added here by dealer/investor HTML -->
      <div style="
        text-align: center;
        padding: var(--spacing-2xl);
        color: var(--color-gray-dark);
      ">
        <p>Loading presentation content...</p>
      </div>
    </main>

    <!-- Footer -->
    <footer id="presentation-footer" style="
      background: var(--color-gray-light);
      border-top: 1px solid var(--color-gray-border);
      padding: var(--spacing-lg);
      text-align: center;
      color: var(--color-gray-dark);
      font-size: var(--font-size-sm);
      margin-top: var(--spacing-2xl);
    ">
      <p>© 2024 BTM Process Controls Pvt Ltd. All rights reserved.</p>
      <p>Last updated: <span id="last-update">Never</span></p>
    </footer>
  </div>

  <!-- ═══════════════════════════════════════════════════════════════ -->
  <!-- TOAST CONTAINER (Shared notifications) -->
  <!-- ═══════════════════════════════════════════════════════════════ -->

  <!-- Toast notifications will be inserted here by toast-notifications.js -->
  <!-- (Container created dynamically) -->

  <!-- ═══════════════════════════════════════════════════════════════ -->
  <!-- SCRIPTS - Load in correct order -->
  <!-- ═══════════════════════════════════════════════════════════════ -->

  <!-- 1. Toast Notifications (used by auth and API handler) -->
  <script src="toast-notifications.js"></script>

  <!-- 2. API Handler (fetches Google Sheet data) -->
  <script>
    // ⚠️ CRITICAL: Set API URL BEFORE loading api-handler.js
    // Get this from Google Apps Script deployment
    // Example: https://script.google.com/macros/s/ABC123XYZ/usercontent
    const API_URL = 'https://script.google.com/macros/s/AKfycbxlgrHzjL22v__NWoEfc5JPNsjuDuq_-MUpxnAkeVYTuLdmPa98wLM3JLHf4A_Eqx1I/exec';
  </script>
  <script src="api-handler.js"></script>

  <!-- 3. Authentication System (password, session management) -->
  <script src="auth-system.js"></script>

  <!-- 4. Presentation-specific logic -->
  <!-- <script src="dealer-logic.js"></script>  for dealer -->
  <!-- <script src="investor-logic.js"></script> for investor -->

  <!-- 5. Initialize when page loads -->
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      console.log('Page loaded. Initializing...');

      // Presentation will initialize:
      // 1. Auth system checks password
      // 2. API loads data
      // 3. Presentation renders content

      // Update last update time in footer
      setInterval(() => {
        const lastUpdate = document.getElementById('last-update');
        if (lastUpdate && isDataLoaded()) {
          lastUpdate.textContent = getLastUpdateTime();
        }
      }, 1000);
    });
  </script>

  <!-- ═══════════════════════════════════════════════════════════════ -->
  <!-- CHART.JS (Optional: for financial charts) -->
  <!-- ═══════════════════════════════════════════════════════════════ -->
  <!-- <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script> -->

</body>
</html>
