:root[data-theme="light"]{--ink:#22303C;--mute:#66788A;--rule:#DDE5EC;--panel:#F4F7FA;--bg:#fff;--card:#fff;
  --navy:#16324F;--steel:#2E6B94;--series:#1B558A;--series-accent:#F26522;--surface:#FFFFFF;
  --shadow:0 10px 30px rgba(12,21,32,.10)}

*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.55;
  -webkit-font-smoothing:antialiased}

/* ─── gate ─────────────────────────────────────────────────────────── */
#gate{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:24px;
  background:linear-gradient(160deg,#0A1B2C,#16324F 58%,#1D4568)}
#gate.hide{display:none}
.gbox{width:min(430px,100%);background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.14);
  border-radius:14px;padding:34px 30px;text-align:center;backdrop-filter:blur(8px)}
.gbox .glogo{width:96px;height:96px;margin:0 auto 18px;border-radius:14px;
  background:#fff var(--logo) center/74% no-repeat;box-shadow:0 8px 26px rgba(0,0,0,.35)}
.gbox h1{font-family:var(--head);color:#fff;font-size:24px;font-weight:700;margin-bottom:7px}
.gbox p{color:#B6CBDE;font-size:14.5px;margin-bottom:24px}
.gbox input{width:100%;padding:13px 15px;font-size:16px;font-family:var(--body);letter-spacing:.09em;
  text-align:center;text-transform:uppercase;border:1px solid rgba(255,255,255,.26);border-radius:8px;
  background:rgba(255,255,255,.07);color:#fff;outline:none}
.gbox input:focus{border-color:var(--accent)}
.gbox input::placeholder{color:#7C93A8;letter-spacing:.04em}
.gbox button{width:100%;margin-top:14px;padding:13px;font-size:16px;font-weight:700;font-family:var(--body);
  background:var(--accent);color:#fff;border:0;border-radius:8px;cursor:pointer;transition:.15s}
.gbox button:hover:not(:disabled){background:#ff7b3d}
.gbox button:disabled{opacity:.55;cursor:not-allowed}
.gmsg{margin-top:15px;font-size:14px;min-height:20px;color:#FFB4A2}
.gnote{margin-top:22px;padding-top:18px;border-top:1px solid rgba(255,255,255,.13);
  color:#7C93A8;font-size:12.5px;line-height:1.5}

/* ─── chrome ───────────────────────────────────────────────────────── */
#app{display:none}
#app.on{display:block}
.topbar{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--rule);
  display:flex;align-items:center;gap:14px;padding:11px 20px;flex-wrap:wrap}
.topbar .tlogo{width:30px;height:30px;flex:0 0 auto;border-radius:6px;
  background:#fff var(--logo) center/84% no-repeat}
.topbar .brand{font-family:var(--head);font-weight:700;color:var(--navy);font-size:16px}
.topbar .conf{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--series-accent);
  border:1px solid currentColor;border-radius:4px;padding:2px 8px}
.topbar .sp{margin-left:auto;display:flex;align-items:center;gap:9px}
.topbar button{background:var(--panel);border:1px solid var(--rule);color:var(--ink);border-radius:7px;
  padding:6px 12px;font-size:13px;cursor:pointer;font-family:var(--body)}
.topbar button:hover{border-color:var(--series)}
.viewer{font-size:12.5px;color:var(--mute)}

main{max-width:1080px;margin:0 auto;padding:34px 22px 90px}
section.s{margin-bottom:56px;scroll-margin-top:70px}
h2{font-family:var(--head);font-size:clamp(21px,3vw,29px);color:var(--navy);margin-bottom:5px}
.lede{color:var(--mute);font-size:15.5px;margin-bottom:22px}

.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(178px,1fr))}
.card{background:var(--card);border:1px solid var(--rule);border-radius:11px;padding:19px 21px}

/* stat tiles — a headline number is not a chart */
.tile{background:var(--card);border:1px solid var(--rule);border-radius:11px;padding:20px}
.tile .v{font-family:var(--head);font-size:40px;font-weight:700;color:var(--series);line-height:1.1}
.tile .u{font-size:17px;color:var(--mute);margin-left:3px}
.tile .l{font-weight:700;margin-top:7px;font-size:15px}
.tile .d{color:var(--mute);font-size:13.5px;margin-top:3px}
.badge{display:inline-block;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;
  border-radius:4px;padding:2px 7px;margin-top:9px;border:1px solid var(--rule);color:var(--mute)}
.badge.proj{color:var(--series-accent);border-color:currentColor}

/* charts */
.charts{display:grid;gap:20px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
figure.ch{background:var(--card);border:1px solid var(--rule);border-radius:11px;padding:17px 17px 12px}
figure.ch figcaption{font-weight:700;font-size:15px;margin-bottom:2px}
figure.ch .sub{color:var(--mute);font-size:12.5px;margin-bottom:12px}
.legend{display:flex;gap:15px;margin-top:9px;font-size:12.5px;color:var(--mute);flex-wrap:wrap}
.legend i{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:5px;vertical-align:-1px}
svg .gridline{stroke:var(--rule);stroke-width:1}
svg .axis{fill:var(--mute);font-size:13px;font-family:var(--body)}
svg .vlab{fill:var(--ink);font-size:13px;font-weight:700;font-family:var(--body)}
svg .mk{transition:opacity .12s}
svg .mk:hover{opacity:.78}

table.tv{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:14px}
table.tv th,table.tv td{border-bottom:1px solid var(--rule);padding:8px 10px;text-align:right}
table.tv th:first-child,table.tv td:first-child{text-align:left}
table.tv thead th{background:var(--panel);color:var(--navy);font-family:var(--head)}
.scroll{overflow-x:auto}

ul.pl{list-style:none}
ul.pl li{position:relative;padding-left:21px;margin-bottom:7px;font-size:14.5px}
ul.pl li::before{content:"";position:absolute;left:0;top:8px;width:8px;height:8px;background:var(--series-accent)}
.ico{font-size:23px;line-height:1}
.rowline{display:flex;gap:13px;align-items:flex-start}
.muted{color:var(--mute);font-size:13.5px}
.tl{position:relative;padding-left:26px}
.tl::before{content:"";position:absolute;left:6px;top:5px;bottom:5px;width:2px;background:var(--rule)}
.tl .it{position:relative;margin-bottom:17px}
.tl .it::before{content:"";position:absolute;left:-24px;top:6px;width:11px;height:11px;border-radius:50%;
  background:var(--series-accent)}
footer.ft{border-top:1px solid var(--rule);margin-top:30px;padding-top:18px;color:var(--mute);font-size:12.5px}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--navy);color:#fff;
  padding:10px 18px;border-radius:8px;font-size:13.5px;opacity:0;transition:.25s;pointer-events:none;z-index:50}
#toast.on{opacity:1}
.audiobar{position:fixed;right:18px;bottom:18px;z-index:30;display:flex;gap:8px;align-items:center;
  background:var(--card);border:1px solid var(--rule);border-radius:30px;padding:7px 13px;box-shadow:var(--shadow)}
.audiobar button{background:none;border:0;color:var(--ink);font-size:16px;cursor:pointer;padding:3px 6px}
.audiobar .lbl{font-size:12px;color:var(--mute)}
@media print{ #gate,.topbar,.audiobar,#toast{display:none!important} }
</style>
</head><body>

<!-- ── access gate ─────────────────────────────────────────────────── -->
<div id="gate">
  <form class="gbox" id="gform" autocomplete="off">
    <div class="glogo" role="img" aria-label="BTM Process Controls"></div>
    <h1>Investor Briefing</h1>
    <p>BTM Process Controls Pvt. Ltd.</p>
    <input id="code" placeholder="Access code" autocomplete="off" spellcheck="false" required>
    <button id="go" type="submit">Unlock</button>
    <div class="gmsg" id="gmsg"></div>
    <div class="gnote">
      Private and confidential. Access is issued individually and recorded.
      If you do not have a code, contact BTM Process Controls directly.
    </div>
  </form>
</div>

<!-- ── deck ────────────────────────────────────────────────────────── -->
<div id="app">
  <div class="topbar">
    <div class="tlogo" aria-hidden="true"></div><span class="brand">BTM Process Controls</span>
    <span class="conf">Confidential</span>
    <div class="sp">
      <span class="viewer" id="viewer"></span>
      <button id="tbl">Table view</button>
      <button id="thm">◐</button>
      <button id="out">Lock</button>
    </div>
  </div>
  <main id="deck"></main>
</div>

<div class="audiobar" id="abar" style="display:none">
  <button id="aplay" title="Play narration">▶</button>
  <span class="lbl" id="alab">Narration</span>
  <button id="amute" title="Mute">♪</button>
</div>
<div id="toast"></div>

<script>
/* ══════════════════════════════════════════════════════════════════════
   CONFIG — set this to your deployed Apps Script /exec URL
   ══════════════════════════════════════════════════════════════════════ */
const API_URL = 'https://script.google.com/macros/s/AKfycbxlgrHzjL22v__NWoEfc5JPNsjuDuq_-MUpxnAkeVYTuLdmPa98wLM3JLHf4A_Eqx1I/exec';

const $  = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => (typeof v === 'number' ? v : parseFloat(String(v).replace(/[^\d.-]/g,'')));

/* Apps Script cannot answer a CORS preflight, so every request stays a
   "simple request": POST + text/plain. Do not change the content type. */
async function api(payload){
  const r = await fetch(API_URL, {
    method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify(payload), redirect:'follow'
  });
  if(!r.ok) throw new Error('network ' + r.status);
  return r.json();
}

function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('on');
  setTimeout(()=>t.classList.remove('on'), 2600); }

/* ─── gate ─────────────────────────────────────────────────────────── */
let TOKEN = sessionStorage.getItem('btm_tok') || '';
let DATA  = null;

$('#gform').addEventListener('submit', async e => {
  e.preventDefault();
  const code = $('#code').value.trim();
  if(!code) return;
  $('#go').disabled = true; $('#gmsg').textContent = 'Checking…';
  try{
    if(API_URL.startsWith('PASTE_')) throw new Error('API_URL not configured');
    const res = await api({action:'auth', code});
    if(!res.ok){
      $('#gmsg').textContent = res.error === 'rate_limited'
        ? 'Too many attempts. Try again later.'
        : 'That code was not recognised.';
      $('#go').disabled = false; return;
    }
    TOKEN = res.token; sessionStorage.setItem('btm_tok', TOKEN);
    await load(res.viewer);
  }catch(err){
    $('#gmsg').textContent = 'Could not reach the server. ' + err.message;
    $('#go').disabled = false;
  }
});

$('#out').onclick = () => { sessionStorage.removeItem('btm_tok'); location.reload(); };
$('#thm').onclick = () => {
  const r=document.documentElement;
  r.dataset.theme = r.dataset.theme==='dark' ? 'light' : 'dark';
  if(DATA) render();                       // charts re-read the themed colours
};

async function load(viewer){
  const res = await api({action:'data', token:TOKEN});
  if(!res.ok){ sessionStorage.removeItem('btm_tok'); location.reload(); return; }
  DATA = res;
  $('#viewer').textContent = viewer || res.viewer || '';
  $('#gate').classList.add('hide');
  $('#app').classList.add('on');
  render();
}

/* ─── charts ───────────────────────────────────────────────────────────
   One measure per chart. Never two y-scales on one plot — revenue (INR Cr)
   and margin (%) are different measures, so they get their own frames.
   Projected years reuse the series hue with a 45° hatch instead of a second
   colour: it reads as "same thing, less certain", and keeps the palette to
   two validated marks in both light and dark mode.                        */
function colVar(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }

function columnChart(labels, values, opts){
  const S = colVar('--series'), INK = colVar('--ink'), RULE = colVar('--rule'), MUT = colVar('--mute');
  const W=330, H=200, PL=36, PR=8, PT=20, PB=28;
  const iw = W-PL-PR, ih = H-PT-PB;
  const max = Math.max(...values)*1.16;
  const bw = Math.min(46, iw/values.length - 10);
  const uid = 'h'+Math.random().toString(36).slice(2,8);
  let g='';
  // recessive gridlines + axis values
  for(let i=0;i<=4;i++){
    const y = PT+ih-(ih*i/4), v = (max*i/4);
    g += `<line class="gridline" x1="${PL}" x2="${W-PR}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}"/>`
       + `<text class="axis" x="${PL-7}" y="${(y+3.5).toFixed(1)}" text-anchor="end">${v>=10?Math.round(v):v.toFixed(1)}</text>`;
  }
  values.forEach((v,i)=>{
    const x = PL + (iw/values.length)*i + (iw/values.length-bw)/2;
    const h = Math.max(2, ih*(v/max));
    const y = PT+ih-h;
    const proj = opts.projectedFrom !== undefined && i >= opts.projectedFrom;
    // 4px rounded data-end, anchored to the baseline
    const r = Math.min(4,h/2);
    const path = `M${x} ${PT+ih} L${x} ${y+r} Q${x} ${y} ${x+r} ${y} L${x+bw-r} ${y} Q${x+bw} ${y} ${x+bw} ${y+r} L${x+bw} ${PT+ih} Z`;
    g += `<path class="mk" d="${path}" fill="${proj?`url(#${uid})`:S}" stroke="${proj?S:'none'}" stroke-width="${proj?1.2:0}">`
       + `<title>${esc(labels[i])}: ${v}${esc(opts.unit||'')}${proj?' (projected)':' (actual)'}</title></path>`;
    g += `<text class="vlab" x="${x+bw/2}" y="${y-6}" text-anchor="middle">${v}</text>`;
    g += `<text class="axis" x="${x+bw/2}" y="${H-10}" text-anchor="middle">${esc(labels[i])}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(opts.title)}">
    <defs><pattern id="${uid}" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)">
      <rect width="6" height="6" fill="${colVar('--card')}"/>
      <line x1="0" y1="0" x2="0" y2="6" stroke="${S}" stroke-width="3.2"/>
    </pattern></defs>${g}</svg>`;
}

function lineChart(labels, values, opts){
  const S = colVar('--series'), CARD = colVar('--card');
  const W=330,H=200,PL=36,PR=12,PT=20,PB=28, iw=W-PL-PR, ih=H-PT-PB;
  const min = Math.min(...values)*0.9, max = Math.max(...values)*1.08;
  const X = i => PL + (iw/(values.length-1))*i;
  const Y = v => PT+ih - ih*((v-min)/(max-min));
  let g='';
  for(let i=0;i<=4;i++){
    const y=PT+ih-(ih*i/4), v=min+(max-min)*i/4;
    g+=`<line class="gridline" x1="${PL}" x2="${W-PR}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}"/>`
      +`<text class="axis" x="${PL-7}" y="${(y+3.5).toFixed(1)}" text-anchor="end">${v.toFixed(0)}</text>`;
  }
  const pts = values.map((v,i)=>`${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(' ');
  const split = opts.projectedFrom ?? values.length;
  // solid through the actuals, dashed once it becomes a projection
  g += `<polyline points="${values.slice(0,split).map((v,i)=>`${X(i)},${Y(v)}`).join(' ')}"
         fill="none" stroke="${S}" stroke-width="2" stroke-linejoin="round"/>`;
  g += `<polyline points="${values.slice(split-1).map((v,i)=>`${X(i+split-1)},${Y(v)}`).join(' ')}"
         fill="none" stroke="${S}" stroke-width="2" stroke-dasharray="5 4" stroke-linejoin="round"/>`;
  values.forEach((v,i)=>{
    g+=`<circle class="mk" cx="${X(i)}" cy="${Y(v)}" r="5" fill="${S}" stroke="${CARD}" stroke-width="2">`
      +`<title>${esc(labels[i])}: ${v}${esc(opts.unit||'')}${i>=split?' (projected)':' (actual)'}</title></circle>`;
    g+=`<text class="vlab" x="${X(i)}" y="${Y(v)-11}" text-anchor="middle">${v}</text>`;
    g+=`<text class="axis" x="${X(i)}" y="${H-10}" text-anchor="middle">${esc(labels[i])}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(opts.title)}">${g}</svg>`;
}

function chartLegend(){
  const S = colVar('--series');
  return `<div class="legend">
    <span><i style="background:${S}"></i>Actual</span>
    <span><i style="background:repeating-linear-gradient(45deg,${S},${S} 3px,transparent 3px,transparent 6px);border:1px solid ${S}"></i>Projected</span>
  </div>`;
}

/* ─── render ───────────────────────────────────────────────────────── */
let SHOW_TABLE = false;
$('#tbl').onclick = () => { SHOW_TABLE = !SHOW_TABLE; $('#tbl').textContent = SHOW_TABLE?'Chart view':'Table view'; render(); };

function finRow(name){ return (DATA.financials||[]).find(r => String(r.Metric).toLowerCase().startsWith(name)); }
function years(){ return Object.keys((DATA.financials||[{}])[0]||{}).filter(k=>/^FY\d{4}$/.test(k)); }

function render(){
  const d = DATA, m = d.meta||{}, c = d.contact||{};
  const ys = years();
  const vals = n => { const r = finRow(n); return r ? ys.map(y=>num(r[y])) : []; };
  const PROJ_FROM = 1;                       // FY2024 actual, everything after projected
  const out = [];

  /* cover */
  out.push(`<section class="s"><h2>${esc(m.deck_title||'Investor Briefing')}</h2>
    <p class="lede">${esc(m.subtitle||'')}</p>
    <div class="card"><div class="grid g3">
      <div><div class="muted">Prepared by</div><b>${esc(m.prepared_by||'')}</b></div>
      <div><div class="muted">Figures as at</div><b>${esc(m.last_updated||'')}</b></div>
      <div><div class="muted">Version</div><b>${esc(m.version||'')}</b></div>
    </div>
    <p class="muted" style="margin-top:14px">${esc(m.fiscal_note||'')}</p></div></section>`);

  /* KPIs — headline numbers are tiles, not charts */
  if(d.kpis?.length) out.push(`<section class="s"><h2>At a glance</h2>
    <div class="grid g4">${d.kpis.map(k=>`<div class="tile">
      <div><span class="v">${esc(k.Value)}</span><span class="u">${esc(k.Unit||'')}</span></div>
      <div class="l">${esc(k.Label)}</div><div class="d">${esc(k.Description||'')}</div>
      <span class="badge ${String(k.Basis).toLowerCase()==='projected'?'proj':''}">${esc(k.Basis||'')}</span>
    </div>`).join('')}</div></section>`);

  /* financials */
  if(ys.length){
    const rev = vals('revenue'), eb = vals('ebitda'), np = vals('net profit');
    const tableFor = (label,unit,v) => `<div class="scroll"><table class="tv"><thead><tr><th>${esc(label)}</th>
        ${ys.map(y=>`<th>${esc(y)}</th>`).join('')}</tr></thead><tbody><tr><td>${esc(unit)}</td>
        ${v.map((x,i)=>`<td>${x}${i>=PROJ_FROM?' <span class="muted">(p)</span>':''}</td>`).join('')}</tr></tbody></table></div>`;
    const fig = (title,sub,unit,v,kind) => `<figure class="ch"><figcaption>${esc(title)}</figcaption>
      <div class="sub">${esc(sub)}</div>
      ${SHOW_TABLE ? tableFor(title,unit,v)
        : (kind==='line' ? lineChart(ys,v,{unit,title,projectedFrom:PROJ_FROM})
                         : columnChart(ys,v,{unit,title,projectedFrom:PROJ_FROM}))}
      ${SHOW_TABLE?'':chartLegend()}</figure>`;
    out.push(`<section class="s"><h2>Financial trajectory</h2>
      <p class="lede">FY2024 actual; FY2025 onward projected. Values in ${esc(m.currency||'INR Crore')} unless marked.</p>
      <div class="charts">
        ${rev.length?fig('Revenue','INR Crore','',rev,'col'):''}
        ${eb.length ?fig('EBITDA margin','per cent','%',eb,'line'):''}
        ${np.length ?fig('Net profit','INR Crore','',np,'col'):''}
      </div>
      <p class="muted" style="margin-top:12px">(p) = projected. Use “Table view” above for the full figures.</p>
    </section>`);
  }

  /* dashboard metrics */
  if(d.dashboard?.length){
    const groups = [...new Set(d.dashboard.map(r=>r.Group))];
    out.push(`<section class="s"><h2>Key metrics</h2><div class="grid g3">${groups.map(gr=>`
      <div class="card"><b>${esc(gr)}</b><div class="scroll"><table class="tv">${d.dashboard.filter(r=>r.Group===gr).map(r=>
        `<tr><td>${esc(r.Metric)}</td><td><b>${esc(r.Value)}</b> <span class="muted">${esc(r.Unit||'')}</span></td></tr>`
      ).join('')}</table></div></div>`).join('')}</div></section>`);
  }

  const cards = (title, lede, rows, fn) => rows?.length
    ? `<section class="s"><h2>${esc(title)}</h2>${lede?`<p class="lede">${esc(lede)}</p>`:''}
       <div class="grid g2">${rows.map(fn).join('')}</div></section>` : '';

  out.push(cards('What drives us','',d.pillars,p=>`<div class="card rowline">
    <span class="ico">${esc(p.Icon)}</span><div><b>${esc(p.Title)}</b><div class="muted">${esc(p.Description)}</div></div></div>`));

  out.push(cards('Industries served','',d.industries,i=>`<div class="card rowline">
    <span class="ico">${esc(i.Icon)}</span><div><b>${esc(i.Name)}</b>
    <div class="muted">${esc(i['Key Applications'])}</div></div></div>`));

  if(d.products?.length) out.push(`<section class="s"><h2>Product range</h2>
    <p class="lede">${d.products.length} engineered pump lines.</p>
    <div class="scroll"><table class="tv"><thead><tr><th>Line</th><th>Category</th><th>Application</th><th>Markets</th></tr></thead>
    <tbody>${d.products.map(p=>`<tr><td>${esc(p.Name)}</td><td>${esc(p.Category)}</td>
      <td>${esc(p.Application)}</td><td>${esc(p.Markets)}</td></tr>`).join('')}</tbody></table></div></section>`);

  if(d.seals?.length) out.push(`<section class="s"><h2>Mechanical seals</h2>
    <div class="scroll"><table class="tv"><thead><tr><th>Model</th><th>Type</th><th>Size</th><th>Max temp.</th><th>Max pressure</th></tr></thead>
    <tbody>${d.seals.map(s=>`<tr><td><b>${esc(s.Model)}</b></td><td>${esc(s.Type)}</td><td>${esc(s['Size Range'])}</td>
      <td>${esc(s['Max Temperature'])}</td><td>${esc(s['Max Pressure'])}</td></tr>`).join('')}</tbody></table></div></section>`);

  if(d.timeline?.length) out.push(`<section class="s"><h2>Our track record</h2><div class="tl">
    ${d.timeline.map(t=>`<div class="it"><b>${esc(t.Year)} — ${esc(t.Title)}</b>
      <div class="muted">${esc(t.Description)}</div></div>`).join('')}</div></section>`);

  out.push(cards('Certifications','',d.certifications,c2=>`<div class="card rowline">
    <span class="ico">${esc(c2.Icon)}</span><div><b>${esc(c2.Name)}</b>
    <div class="muted">${esc(c2.Description)} · ${esc(c2.Scope)}</div></div></div>`));

  if(d.caseStudies?.length) out.push(`<section class="s"><h2>Selected outcomes</h2>
    <div class="scroll"><table class="tv"><thead><tr><th>Industry</th><th>Challenge</th><th>Solution</th><th>Result</th></tr></thead>
    <tbody>${d.caseStudies.map(x=>`<tr><td>${esc(x.Industry)}</td><td>${esc(x.Challenge)}</td>
      <td>${esc(x.Solution)}</td><td><b>${esc(x.Results)}</b></td></tr>`).join('')}</tbody></table></div></section>`);

  if(d.roadmap?.length){
    const total = d.roadmap.reduce((a,r)=>a+(num(r['Investment (INR Cr)'])||0),0);
    out.push(`<section class="s"><h2>Growth roadmap</h2>
      <p class="lede">Planned investment of INR ${total} Cr across five initiatives.</p>
      <div class="scroll"><table class="tv"><thead><tr><th>When</th><th>Initiative</th><th>Impact</th>
        <th>Investment (INR Cr)</th><th>Expected outcome</th></tr></thead>
      <tbody>${d.roadmap.map(r=>`<tr><td>${esc(r.Timeline)}</td><td><b>${esc(r.Initiative)}</b></td>
        <td>${esc(r.Impact)}</td><td>${esc(r['Investment (INR Cr)'])}</td>
        <td>${esc(r['Expected Outcome'])}</td></tr>`).join('')}</tbody></table></div></section>`);
  }

  out.push(cards('Where we are going','',d.vision,v=>`<div class="card rowline">
    <span class="ico">${esc(v.Icon)}</span><div><b>${esc(v.Title)}</b>
    <div class="muted">${esc(v.Description)}</div></div></div>`));

  out.push(cards('Leadership','',d.team,t=>`<div class="card">
    <b>${esc(t.Name)}</b> <span class="muted">· ${esc(t.Position)}</span>
    <div class="muted" style="margin-top:5px">${esc(t.Experience)} · ${esc(t.Expertise)}</div>
    <div class="muted">${esc(t.Background)}</div></div>`));

  /* only quotes cleared by the named person reach this page */
  if(d.testimonials?.length) out.push(cards('In our customers’ words','',d.testimonials,t=>`<div class="card">
    <div style="font-style:italic">“${esc(t.Quote)}”</div>
    <div class="muted" style="margin-top:7px">${esc(t.Author)}, ${esc(t.Role)} — ${esc(t.Company)}</div></div>`));

  out.push(`<section class="s"><h2>Contact</h2><div class="card">
    <div class="grid g2">
      <div><b>${esc(c.Company||'')}</b><div class="muted">${esc(c.Address||'')}</div></div>
      <div><div>${esc(c.Phone||'')}</div>
        <div><a href="mailto:${esc(c.Email||'')}" style="color:var(--series)">${esc(c.Email||'')}</a></div>
        <div class="muted">${esc(c.Website||'')}</div></div>
    </div></div>
    <footer class="ft">${esc(m.confidentiality||'Private and confidential.')}
      Issued to ${esc(d.viewer||'')} · figures as at ${esc(m.last_updated||'')} · v${esc(m.version||'')}</footer>
  </section>`);

  $('#deck').innerHTML = out.join('');
  setupAudio();
}

/* ─── narration ────────────────────────────────────────────────────────
   Fetched per section and only after unlock. The audio speaks the financial
   figures, so it lives in Drive behind the same gate — never in this repo. */
let audio = new Audio(), curSection = 0, playing = false;
function setupAudio(){
  const secs = [...document.querySelectorAll('section.s')];
  if(!secs.length) return;
  $('#abar').style.display = 'flex';
  $('#aplay').onclick = async () => {
    if(playing){ audio.pause(); playing=false; $('#aplay').textContent='▶'; return; }
    playing = true; $('#aplay').textContent='❚❚';
    await speak(curSection+1);
  };
  $('#amute').onclick = () => { audio.muted = !audio.muted; $('#amute').textContent = audio.muted?'🔇':'♪'; };
  audio.onended = async () => {
    if(!playing) return;
    if(curSection < secs.length-1){
      curSection++;
      secs[curSection].scrollIntoView({behavior:'smooth', block:'start'});
      await speak(curSection+1);
    } else { playing=false; $('#aplay').textContent='▶'; }
  };
}
async function speak(n){
  $('#alab').textContent = `Section ${n}`;
  try{
    const r = await api({action:'audio', token:TOKEN, slide:n});
    if(!r.ok){
      // say what is actually wrong, and where the fix is
      const msg = r.error === 'audio_not_configured'
        ? 'Narration folder not found — upload inv*.mp3 beside the Sheet, then run checkSetup()'
        : r.error === 'not_found'
          ? `Missing ${r.file||'clip'}${r.folder?` in "${r.folder}"`:''}`
          : 'Narration unavailable';
      $('#alab').textContent = 'Narration off';
      toast(msg);
      $('#abar').title = msg;
      playing = false; $('#aplay').textContent = '▶';
      return;
    }
    audio.src = 'data:audio/mpeg;base64,' + r.b64;
    await audio.play();
  }catch(e){ toast('Narration unavailable'); playing=false; $('#aplay').textContent='▶'; }
}

/* resume an unlocked session on refresh */
if(TOKEN && !API_URL.startsWith('PASTE_')) load().catch(()=>sessionStorage.removeItem('btm_tok'));
</script>
